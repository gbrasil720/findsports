name: Setup monorepo (Bun + deps)
description: Pin Bun, restore install cache, run bun install --frozen-lockfile, and save the cache on master only

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: '1.3.1'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    # PRs só leem o cache da master: salvar por PR (refs/pull/N/merge) criava
    # uma cópia de ~440 MB por PR e estourava a cota de 10 GB do repositório.
    - uses: actions/cache/restore@v4
      id: bun-cache
      with:
        path: |
          ~/.bun/install/cache
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - shell: bash
      run: bun install --frozen-lockfile
    - if: github.ref == 'refs/heads/master' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
