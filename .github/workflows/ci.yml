name: CI

on:
  pull_request:
  push:
    branches: [master]

# Escopo do `GITHUB_TOKEN` de todo job. Sem este bloco ele herda o padrão das
# configurações do repositório, que muda sem aparecer em diff (WEB-237). Só o
# `actions/checkout` usa o token; o deploy usa o do Cloudflare.
permissions:
  contents: read

# Push novo num PR cancela o run anterior dele. Em master cada push tem grupo
# próprio (o SHA): nada cancela um deploy de produção.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Portão do CodeRabbit: os outros jobs só começam quando ele termina a revisão
  # deste commit ("Review completed") ou avisa que não vai revisar ("Review rate
  # limited", bot, pulado). Assim um achado dele não custa uma rodada inteira de
  # CI que seria refeita depois da correção. Lê o status `CodeRabbit` do commit
  # (pending -> success). Sem status em 3 min (CodeRabbit fora, PR que ele não
  # olha) ou preso em pending por 15 min, segue assim mesmo: o portão atrasa, não
  # bloqueia. No push em `master` não espera nada.
  coderabbit:
    name: revisão do CodeRabbit
    runs-on: ubuntu-latest
    permissions:
      statuses: read
    timeout-minutes: 20
    steps:
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          start=$(date +%s)
          while :; do
            line=$(gh api "repos/$REPO/commits/$SHA/statuses" \
              --jq '[.[] | select(.context == "CodeRabbit")][0] | select(.) | "\(.state)\t\(.description)"' || true)
            state=${line%%$'\t'*}
            elapsed=$(( $(date +%s) - start ))
            if [ -n "$line" ] && [ "$state" != pending ]; then
              echo "CodeRabbit: ${line#*$'\t'} ($state)"
              exit 0
            fi
            if [ -z "$line" ] && [ "$elapsed" -ge 180 ]; then
              echo "::notice::CodeRabbit não marcou este commit em 3 min; seguindo sem ele."
              exit 0
            fi
            if [ "$elapsed" -ge 900 ]; then
              echo "::warning::CodeRabbit em pending há 15 min; seguindo sem ele."
              exit 0
            fi
            sleep 15
          done

  # Tipagem e portão do deploy (WEB-330): sem Postgres — roda em paralelo com
  # `unit-test` e `e2e`. Em PR, `turbo --filter=...[origin/master]` limita ao
  # que mudou (e dependentes); no push em master, suíte completa.
  #
  # O alvo do deploy sai só do evento, sem ler segredo: este job não tem
  # `environment`, então segredo lido aqui seria o de repositório, visível a
  # qualquer PR. Os segredos ficam no job `deploy`, dentro do environment.
  # Produção: push em `master` do repositório original. Preview: PR de um
  # branch deste repositório que não seja do Dependabot. Fork (PR ou push no
  # próprio fork) e Dependabot não têm alvo e pulam o deploy.
  check:
    name: lint, tipos e migrations
    needs: coderabbit
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.gate.outputs.target }}
    steps:
      - id: gate
        env:
          TARGET: >-
            ${{ !github.event.repository.fork
            && ((github.event_name == 'push'
            && github.ref == 'refs/heads/master'
            && 'production')
            || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.user.login != 'dependabot[bot]'
            && 'preview'))
            || '' }}
        run: |
          if [ -n "$TARGET" ]; then
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy pulado: fork, Dependabot ou evento sem alvo (WEB-204)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Lint (Biome + classes onside-*)
        run: bun run check
      - name: Fetch base branch (affected)
        if: github.event_name == 'pull_request'
        run: git fetch origin master --no-tags
      - name: Migrations compatíveis com o código no ar
        if: github.event_name == 'pull_request'
        run: scripts/check-migrations.sh origin/master
      - name: Check types (affected packages)
        if: github.event_name == 'pull_request'
        run: bunx turbo run check-types --filter=...[origin/master]
      - name: Check types (full tree)
        if: github.event_name != 'pull_request'
        run: bun run check-types

  unit-test:
    name: testes e schema
    needs: coderabbit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://findsports_load_test:findsports_load_test_local@127.0.0.1:5432/findsports_load_test
      LOAD_TEST_DATABASE_URL: postgres://findsports_load_test:findsports_load_test_local@127.0.0.1:5432/findsports_load_test
      RUN_DISPOSABLE_DB_TESTS: "1"
    services:
      postgres:
        # GHCR (WEB-330): literal obrigatório — `services.*.image` não aceita `env`.
        image: ghcr.io/gbrasil720/findsports/ci-postgis:17-3.5-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: findsports_load_test
          POSTGRES_USER: findsports_load_test
          POSTGRES_PASSWORD: findsports_load_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findsports_load_test -d findsports_load_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-monorepo
      - run: bun run db:migrate
        working-directory: packages/db
      # Schema mudou e ninguém rodou `db:generate`: o arquivo nasceria aqui.
      - name: Schema sem migration
        working-directory: packages/db
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            git status --short src/migrations
            echo "::error::O schema mudou sem migration. Rode bun run db:generate e comite o arquivo."
            exit 1
          fi
      - run: bun run test

  e2e:
    # Suíte Playwright (WEB-174, docs/e2e.md): build em Node contra um Postgres
    # descartável, Chromium desktop + Pixel 7, sem rede externa.
    # `desktop`/`mobile` divididos em 8 shards pelo tempo medido de cada
    # arquivo (`apps/e2e/shard.ts`). Não mais que isso: a conta roda 20 jobs
    # por vez, e com vários PRs abertos o shard a mais espera na fila. Os
    # `*-serial` num job à parte, porque como dependência eles puxariam a suíte
    # inteira para cada shard.
    #
    # Só em PR: o push em `master` é o merge de uma PR que já passou por
    # aqui, e rodar de novo dobrava os minutos e atrasava o deploy (WEB-236).
    # PR só de `apps/mobile`, `docs` ou `*.md` pula os passos (`web-scope`).
    if: github.event_name == 'pull_request'
    needs: coderabbit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8, serial]
    env:
      E2E_DATABASE_URL: postgres://findsports_e2e:findsports_e2e_local@127.0.0.1:5432/findsports_e2e
    services:
      postgres:
        image: ghcr.io/gbrasil720/findsports/ci-postgis:17-3.5-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: findsports_e2e
          POSTGRES_USER: findsports_e2e
          POSTGRES_PASSWORD: findsports_e2e_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findsports_e2e -d findsports_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        uses: ./.github/actions/web-scope
      - if: steps.scope.outputs.web == 'true'
        uses: ./.github/actions/setup-monorepo
      - if: steps.scope.outputs.web == 'true'
        uses: ./.github/actions/setup-playwright
      - if: steps.scope.outputs.web == 'true' && matrix.part != 'serial'
        run: bunx playwright test --project=desktop --project=mobile $(bun shard.ts ${{ matrix.part }} 8)
        working-directory: apps/e2e
      - if: steps.scope.outputs.web == 'true' && matrix.part == 'serial'
        run: |
          bunx playwright test --project=setup
          bunx playwright test --project=desktop-serial --no-deps
          bunx playwright test --project=mobile-serial --no-deps
        working-directory: apps/e2e
      # Tempo de cada arquivo neste shard, para `apps/e2e/shard.ts --record`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.web == 'true' && matrix.part != 'serial' && !cancelled()
        with:
          name: e2e-durations-${{ matrix.part }}
          path: apps/e2e/durations-report.json
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.part }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 3

  e2e-worker:
    name: bundle do Worker e tamanho
    needs: coderabbit
    # Bundle real do Worker em workerd (docs/e2e.md, "Suíte do Worker"). A
    # suíte `e2e` roda em `vite dev`, que serve `public/` de outro jeito: foi
    # essa diferença que escondeu a WEB-269. Sem banco: só arquivo estático.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        uses: ./.github/actions/web-scope
      - if: steps.scope.outputs.web == 'true'
        uses: ./.github/actions/setup-monorepo
      - if: steps.scope.outputs.web == 'true'
        uses: ./.github/actions/setup-playwright
      - name: Build do Worker
        if: steps.scope.outputs.web == 'true'
        working-directory: apps/web
        run: bun run build:cf
      # docs/perf-home.md: o chunk de entrada vai em toda página. Medido em
      # 17/11/2026, neste job: 193 kB com gzip (o build local em
      # `development` sai maior, 286 kB). Passou do teto, ache o que entrou (import
      # estático de algo pesado) antes de subir o número.
      - name: Tamanho do JavaScript de entrada
        if: steps.scope.outputs.web == 'true'
        working-directory: apps/web
        run: |
          size=$(cat dist/client/assets/index-*.js | gzip -9c | wc -c)
          echo "Entrada: $size bytes com gzip (teto 215000)"
          [ "$size" -gt 0 ] && [ "$size" -le 215000 ]
      - if: steps.scope.outputs.web == 'true'
        run: bunx playwright test -c playwright.worker.config.ts
        working-directory: apps/e2e

  # O app só tinha `tsc`. O Metro empacotando pega import que não resolve,
  # asset que falta e módulo de servidor que entrou no bundle (~20 s).
  mobile:
    name: bundle do app
    needs: coderabbit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-monorepo
      - run: bunx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
        working-directory: apps/mobile

  # WEB-204: deploy no Cloudflare Workers (produção = Worker `onside-web`, preview =
  # `onside-web-preview`). Não há deploy Vercel neste repositório — só Workers.
  deploy:
    name: deploy e smoke
    needs: [check, unit-test, e2e, e2e-worker]
    if: >-
      ${{ !cancelled()
      && needs.check.result == 'success'
      && needs.unit-test.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
      && (needs.e2e-worker.result == 'success' || needs.e2e-worker.result == 'skipped')
      && needs.check.outputs.target != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.check.outputs.target }}
      url: ${{ needs.check.outputs.target == 'production' && 'https://www.onside.sh' || 'https://onside-web-preview.dev-guilhermebrasil.workers.dev' }}
    concurrency:
      group: deploy-${{ needs.check.outputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.check.outputs.target }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Segredos do environment (`Production`/`Preview`) sobrepõem os de
      # repositório de mesmo nome: o job funciona antes e depois da mudança.
      - name: Segredos do deploy
        env:
          DEPLOY_DATABASE_URL: ${{ needs.check.outputs.target == 'production' && secrets.DATABASE_URL_PROD || needs.check.outputs.target == 'preview' && secrets.DATABASE_URL_PREVIEW || '' }}
          DB_SECRET: ${{ needs.check.outputs.target == 'production' && 'DATABASE_URL_PROD' || 'DATABASE_URL_PREVIEW' }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$DEPLOY_DATABASE_URL" ] || missing="$missing $DB_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Deploy de $TARGET sem segredos:$missing (environment ou repositório)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-monorepo
      - name: Migrations
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ needs.check.outputs.target == 'production' && secrets.DATABASE_URL_PROD || needs.check.outputs.target == 'preview' && secrets.DATABASE_URL_PREVIEW || '' }}
        run: bun run db:migrate:deploy
      # WEB-381: catálogo de times e atletas (`packages/db/src/catalog/data`).
      # Depois da migration, que cria as colunas; só escreve o que mudou.
      - name: Catálogo de times
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ needs.check.outputs.target == 'production' && secrets.DATABASE_URL_PROD || needs.check.outputs.target == 'preview' && secrets.DATABASE_URL_PREVIEW || '' }}
        run: bun run db:catalog:sync
      # O branch `preview` do Neon é cópia de produção: tira login, nome e
      # e-mail de gente de verdade a cada "Reset from parent". Só o segredo do
      # preview, nunca a expressão que escolhe produção.
      - name: Anonimizar o preview
        if: needs.check.outputs.target == 'preview'
        env:
          ANONYMIZE_TARGET: preview
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        working-directory: packages/db
        run: bun run db:anonymize:preview
      - name: Build
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: ${{ needs.check.outputs.target == 'preview' && 'preview' || '' }}
          VITE_MAP_TILES_URL: ${{ vars.VITE_MAP_TILES_URL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: bun run build:cf
      - name: Deploy
        working-directory: apps/web
        # WEB-389: a tag (commit curto) é o que o Bastidores do Houdini mostra.
        run: bunx wrangler deploy --message "${{ github.event_name }} ${{ github.sha }}" --tag "${GITHUB_SHA::7}"
      # O que acabou de subir responde? `/api/app/status` dá 503 sem banco.
      # Falhou em produção: `bunx wrangler rollback` em apps/web volta o
      # código (não a migration).
      - name: Smoke
        env:
          URL: ${{ needs.check.outputs.target == 'production' && 'https://www.onside.sh' || 'https://onside-web-preview.dev-guilhermebrasil.workers.dev' }}
        run: |
          for path in / /api/app/status; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$URL$path"
          done
