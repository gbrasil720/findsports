name: CI

on:
  pull_request:
  push:
    branches: [master]

# Escopo do `GITHUB_TOKEN` de todo job. Sem este bloco ele herda o padrão das
# configurações do repositório, que muda sem aparecer em diff (WEB-237). Só o
# `actions/checkout` usa o token; o deploy usa o do Cloudflare.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://findsports_load_test:findsports_load_test_local@127.0.0.1:5432/findsports_load_test
      LOAD_TEST_DATABASE_URL: postgres://findsports_load_test:findsports_load_test_local@127.0.0.1:5432/findsports_load_test
      RUN_DISPOSABLE_DB_TESTS: "1"
    services:
      postgres:
        image: imresamu/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: findsports_load_test
          POSTGRES_USER: findsports_load_test
          POSTGRES_PASSWORD: findsports_load_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findsports_load_test -d findsports_load_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    outputs:
      target: ${{ steps.gate.outputs.target }}
    steps:
      # Portão do `deploy` (WEB-204): o `if` de job não enxerga `secrets`,
      # então eles são lidos aqui e viram o output `target`. Vazio = deploy
      # pulado. Mora neste job, que já roda em todo evento, para não pagar um
      # job à parte por um step de 3 s (WEB-236).
      - id: gate
        env:
          TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Sem `a && b || c`: com o segredo de produção vazio, `|| c` entregaria
          # o banco de preview a um deploy de produção. O `|| ''` final evita
          # que `false` vire a string "false" e abra o portão.
          DEPLOY_DATABASE_URL: ${{ github.event_name == 'push' && secrets.DATABASE_URL_PROD || github.event_name != 'push' && secrets.DATABASE_URL_PREVIEW || '' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$DEPLOY_DATABASE_URL" ]; then
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy de $TARGET pulado: faltam segredos do Cloudflare ou do banco (WEB-204)."
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
        working-directory: packages/db
      - run: bun run check-types
      - run: bun run test

  e2e:
    # Suíte Playwright (WEB-174, docs/e2e.md): `vite dev` contra um Postgres
    # descartável, Chromium desktop + Pixel 7, sem rede externa.
    # `desktop`/`mobile` divididos em 4 shards; os `*-serial` num job à parte,
    # porque como dependência eles puxariam a suíte inteira para cada shard.
    #
    # Só em PR: o push em `master` é o merge de uma PR que já passou por
    # aqui, e rodar de novo dobrava os minutos e atrasava o deploy (WEB-236).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, serial]
    env:
      E2E_DATABASE_URL: postgres://findsports_e2e:findsports_e2e_local@127.0.0.1:5432/findsports_e2e
    services:
      postgres:
        image: imresamu/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: findsports_e2e
          POSTGRES_USER: findsports_e2e
          POSTGRES_PASSWORD: findsports_e2e_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findsports_e2e -d findsports_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - if: matrix.part != 'serial'
        run: bunx playwright test --project=desktop --project=mobile --shard=${{ matrix.part }}/4
        working-directory: apps/e2e
      # `--no-deps` pula desktop/mobile (já cobertos nos shards); um projeto
      # por vez porque os dois mexem no mesmo `app_config`.
      - if: matrix.part == 'serial'
        run: |
          bunx playwright test --project=setup
          bunx playwright test --project=desktop-serial --no-deps
          bunx playwright test --project=mobile-serial --no-deps
        working-directory: apps/e2e
      # Trace, vídeo e screenshot só existem para teste que falhou
      # (`retain-on-failure` no playwright.config.ts).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.part }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14

  # WEB-204: deploy no Cloudflare Workers depois de check (e de e2e, em PR). Push em
  # master → migration no banco de produção e Worker `onside-web`; PR →
  # migration no branch `preview` do Neon e Worker `onside-web-preview`
  # (uma URL só: o último PR publicado ganha).
  #
  # Este job é o ÚNICO lugar que migra produção. Sem os segredos (PR de fork, ou antes de cadastrá-los) o deploy é
  # pulado e o CI segue verde: o step `gate` do `check` deixa `target` vazio.
  deploy:
    needs: [check, e2e]
    # `e2e` é pulado no push em `master`, e um `needs` pulado pularia este job
    # junto; o `!cancelled()` desliga esse padrão e os resultados são
    # conferidos à mão.
    if: >-
      ${{ !cancelled()
      && needs.check.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
      && needs.check.outputs.target != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.check.outputs.target }}
      url: ${{ needs.check.outputs.target == 'production' && 'https://www.onside.sh' || 'https://onside-web-preview.dev-guilhermebrasil.workers.dev' }}
    # Um deploy por alvo de cada vez, sem cancelar o que já começou: migration
    # pela metade não volta sozinha.
    concurrency:
      group: deploy-${{ needs.check.outputs.target }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      # Antes do deploy: a migration tem de ser compatível com o código
      # anterior (expand → contract), que segue no ar até o `wrangler deploy`
      # terminar e é para onde o rollback volta.
      - name: Migrations
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ needs.check.outputs.target == 'production' && secrets.DATABASE_URL_PROD || needs.check.outputs.target == 'preview' && secrets.DATABASE_URL_PREVIEW || '' }}
        run: bun run db:migrate:deploy
      # O ambiente do wrangler.jsonc é escolhido no build (`CLOUDFLARE_ENV`);
      # o `wrangler deploy` só lê o dist/server/wrangler.json já resolvido.
      - name: Build
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: ${{ needs.check.outputs.target == 'preview' && 'preview' || '' }}
          VITE_MAP_TILES_URL: ${{ vars.VITE_MAP_TILES_URL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: bun run build:cf
      - name: Deploy
        working-directory: apps/web
        run: bunx wrangler deploy --message "${{ github.event_name }} ${{ github.sha }}"
