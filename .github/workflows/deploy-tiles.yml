# WEB-218: publicação manual do Worker `onside-tiles`.
#
# Não roda em push/PR: `tiles.onside.sh` hoje é custom domain do bucket R2;
# deploy automático colidiria ou tomaria o hostname sem aprovação.
name: Deploy tiles worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Segredos do environment `Production` (sobrepõem os de repositório): o
    # token precisa alcançar o Worker `onside-tiles`, e com política de branch
    # `master` o disparo manual tem de partir de `master`.
    environment:
      name: production
    concurrency:
      group: deploy-tiles-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-monorepo
      - name: Deploy onside-tiles
        working-directory: apps/tiles
        run: bunx wrangler deploy --message "workflow_dispatch ${{ github.sha }}"
