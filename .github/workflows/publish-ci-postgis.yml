name: Publish CI PostGIS image

# Imagem usada pelos service containers do CI (WEB-330). Não depende de Docker Hub.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/docker/postgis/**
      - .github/workflows/publish-ci-postgis.yml
  push:
    branches: [master]
    paths:
      - .github/docker/postgis/**
      - .github/workflows/publish-ci-postgis.yml

# Só o job `publish`, fora de PR, escreve no GHCR: o token de um PR (que roda o
# código do branch) nunca recebe `packages: write`.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/gbrasil720/findsports/ci-postgis
  BASE_IMAGE: public.ecr.aws/docker/library/postgres:17-alpine
  POSTGIS_REF: 2bcd236e3af9ec6e668db51eb37162a79f0eaeaa

jobs:
  # Em PR só constrói: publicar trocaria a imagem que o CI da master usa.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Evita buildx/bootkit no Docker Hub (moby/buildkit); o daemon do runner basta.
      - name: Build PostGIS (PostGIS 3.5 / Postgres 17 alpine)
        run: .github/docker/postgis/build.sh

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PostGIS (PostGIS 3.5 / Postgres 17 alpine)
        run: .github/docker/postgis/build.sh
      - name: Push
        run: |
          docker push "${IMAGE_NAME}:17-3.5-alpine"
          docker push "${IMAGE_NAME}:latest"
