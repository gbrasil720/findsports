name: Publish CI PostGIS image

# Imagem usada pelos service containers do CI (WEB-330). Não depende de Docker Hub.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/docker/postgis/**
      - .github/workflows/publish-ci-postgis.yml
  push:
    branches: [master]
    paths:
      - .github/docker/postgis/**
      - .github/workflows/publish-ci-postgis.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/gbrasil720/findsports/ci-postgis
  BASE_IMAGE: public.ecr.aws/docker/library/postgres:17-alpine
  POSTGIS_REF: 2bcd236e3af9ec6e668db51eb37162a79f0eaeaa

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Evita buildx/bootkit no Docker Hub (moby/buildkit); o daemon do runner basta.
      - name: Build PostGIS (PostGIS 3.5 / Postgres 17 alpine)
        run: |
          set -euo pipefail
          # Commit fixo: o master do docker-postgis tirou 17-3.5/alpine em 18/10/2026
          # (#463), e um clone do master quebrava o build.
          git init -q /tmp/docker-postgis
          git -C /tmp/docker-postgis fetch -q --depth 1 https://github.com/postgis/docker-postgis.git "${POSTGIS_REF}"
          git -C /tmp/docker-postgis checkout -q FETCH_HEAD
          docker build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            -t "${IMAGE_NAME}:17-3.5-alpine" \
            -t "${IMAGE_NAME}:latest" \
            /tmp/docker-postgis/17-3.5/alpine
      # Em PR só constrói: publicar trocaria a imagem que o CI da master usa.
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker push "${IMAGE_NAME}:17-3.5-alpine"
          docker push "${IMAGE_NAME}:latest"
