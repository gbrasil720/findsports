name: Publish CI PostGIS image

# Imagem usada pelos service containers do CI (WEB-330). Não depende de Docker Hub.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/docker/postgis/**
      - .github/workflows/publish-ci-postgis.yml
  push:
    branches: [master]
    paths:
      - .github/docker/postgis/**
      - .github/workflows/publish-ci-postgis.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/gbrasil720/findsports/ci-postgis

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/postgis/docker-postgis.git#master:17-3.5/alpine
          build-args: |
            BASE_IMAGE=public.ecr.aws/docker/library/postgres:17-alpine
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:17-3.5-alpine
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
