name: Publish CI PostGIS image

# Imagem usada pelos service containers do CI (WEB-330). Não depende de Docker Hub.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/docker/postgis/**
      - .github/workflows/publish-ci-postgis.yml
  push:
    branches: [master]
    paths:
      - .github/docker/postgis/**
      - .github/workflows/publish-ci-postgis.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/gbrasil720/findsports/ci-postgis
  BASE_IMAGE: public.ecr.aws/docker/library/postgres:17-alpine

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Evita buildx/bootkit no Docker Hub (moby/buildkit); o daemon do runner basta.
      - name: Build PostGIS (PostGIS 3.5 / Postgres 17 alpine)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/postgis/docker-postgis.git /tmp/docker-postgis
          docker build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            -t "${IMAGE_NAME}:17-3.5-alpine" \
            -t "${IMAGE_NAME}:latest" \
            /tmp/docker-postgis/17-3.5/alpine
      - name: Push
        run: |
          docker push "${IMAGE_NAME}:17-3.5-alpine"
          docker push "${IMAGE_NAME}:latest"
