plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'sh.onside'
version = '0.1.0'

android {
  namespace "sh.onside.foldposture"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.window:window:1.3.0"
  implementation "androidx.window:window-java:1.3.0"
}
