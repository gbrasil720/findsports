<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12120F" />
    <title>Sem conexão — Onside</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f1eee6;
        color: #12120f;
        font-family: system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 26rem;
        border: 1.5px solid #12120f;
        background: #f1eee6;
        box-shadow: 4px 4px 0 #12120f;
        padding: 24px;
      }
      h1 { margin: 0 0 12px; font-size: 1.25rem; line-height: 1.2; }
      p { margin: 0 0 16px; line-height: 1.5; }
      button {
        min-height: 44px;
        padding: 0 16px;
        border: 1.5px solid #12120f;
        background: #c9f135;
        color: #12120f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>
        O Onside precisa de internet para saber quais bares estão passando o
        jogo agora. Assim que a conexão voltar, é só recarregar.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
