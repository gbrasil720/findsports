<title>Onside · bares com jogo hoje</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Web do torcedor, registro de uso do DESIGN.md "O Telão do Bar": régua da noite como filtro, lista larga com fotos e mapa real ao lado. */
:root{
  --bg:#f1eee6; --fg:#12120f; --card:#faf8f3; --sub:#e7e3db; --line:rgba(18,18,15,.1); --line2:rgba(18,18,15,.18);
  --muted:#55554f; --body:#3a3a35; --drop:#d9d4c8; --field:#fff;
  --acid:#c9f135; --acid-drop:#7f9a12; --acid-deep:#5b6d0c;
  --live:#e8320c; --live-text:#c92b0c; --hl:#e8320c;
  --ink:#12120f; --paper:#f1eee6; --spark:#e8320c;
  --shadow:0 3px 0 var(--drop),0 24px 40px -32px rgba(18,18,15,.45);
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --text:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12120f; --fg:#f1eee6; --card:#1c1c18; --sub:#26261f; --line:rgba(241,238,230,.1); --line2:rgba(241,238,230,.18);
  --muted:#aaa9a4; --body:#d6d3cb; --drop:#000; --field:#1c1c18; --live:#f3421d; --live-text:#f3421d; --hl:#c9f135; --spark:#c9f135; --inkc:#1c1c18;
  --shadow:0 3px 0 #000,0 24px 40px -30px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12120f; --fg:#f1eee6; --card:#1c1c18; --sub:#26261f; --line:rgba(241,238,230,.1); --line2:rgba(241,238,230,.18);
  --muted:#aaa9a4; --body:#d6d3cb; --drop:#000; --field:#1c1c18; --live:#f3421d; --live-text:#f3421d; --hl:#c9f135; --spark:#c9f135; --inkc:#1c1c18;
  --shadow:0 3px 0 #000,0 24px 40px -30px rgba(0,0,0,.8); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--text);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
img{max-width:100%;height:auto;display:block}
svg{flex:none}
a{color:inherit}
button{font:inherit;color:inherit}
::selection{background:var(--acid);color:var(--ink)}
:focus-visible{outline:3px solid var(--acid);outline-offset:2px;border-radius:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:0;margin:0}
.hl{color:var(--hl)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;border:0;font:700 15px/1 var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .2s}
.btn:active{transform:translateY(3px)}
.b-acid{background:var(--acid);color:var(--ink);box-shadow:0 4px 0 var(--acid-drop)}
.b-acid:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--acid-drop)}
.b-acid:active{box-shadow:0 1px 0 var(--acid-drop)}
.b-ink{background:var(--fg);color:var(--bg);box-shadow:0 4px 0 #000}
.b-ink:hover{transform:translateY(-2px);box-shadow:0 6px 0 #000}
.b-ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.b-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--fg)}
.sm{height:42px;padding:0 18px;font-size:14.5px}
.ic{width:42px;height:42px;padding:0;border-radius:50%}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:76px;padding-left:max(28px,var(--gl));padding-right:max(28px,var(--gr))}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.logo b{font:400 24px/1 var(--display)}
.logo i{display:inline-block;width:6px;height:6px;background:#e8320c;margin-left:2px}
.q{flex:1 1 auto;min-width:0;max-width:560px;display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 18px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line2);transition:box-shadow .2s}
.q:focus-within{box-shadow:inset 0 0 0 2px var(--fg)}
.q input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--text);color:var(--fg);outline:none}
.q input::placeholder{color:var(--muted)}
.where{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;background:var(--sub);border:0;font:600 14px/1 var(--text);cursor:pointer;white-space:nowrap}
.top .sp{flex:1}
.top nav{display:flex;align-items:center;gap:8px;flex:none}
.top nav .lnk{font:600 15px var(--text);text-decoration:none;padding:10px 12px;border-radius:999px}
.top nav .lnk:hover{background:var(--sub)}

/* régua */
.night{padding:26px max(28px,var(--gr)) 22px max(28px,var(--gl));border-bottom:1px solid var(--line)}
.night-h{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.days{display:flex;gap:6px;background:var(--sub);padding:4px;border-radius:999px}
.days button{border:0;background:transparent;height:38px;padding:0 16px;border-radius:999px;font:600 14px var(--text);cursor:pointer}
.days button.on{background:var(--fg);color:var(--bg)}
.now{font:500 13.5px var(--mono);color:var(--muted)}
.now b{color:var(--fg)}
.rule-wrap{margin:18px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.rule-wrap::-webkit-scrollbar{display:none}
.rule{position:relative;min-width:980px;height:226px}
.hours{position:absolute;inset:0 0 auto;height:22px}
.hours span{position:absolute;transform:translateX(-50%);font:500 12px var(--mono);color:var(--muted)}
.grid{position:absolute;inset:26px 0 0;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:10% 100%;border-top:1.5px solid var(--fg)}
.nowline{position:absolute;top:18px;bottom:0;width:2px;background:var(--live);z-index:2}
.nowline::before{content:"AGORA";position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);background:var(--live);color:#12120f;font:600 10.5px/1 var(--mono);letter-spacing:.06em;padding:4px 6px;border-radius:5px}
.gm{position:absolute;height:56px;border:0;border-radius:16px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);box-shadow:0 3px 0 var(--drop);transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s;overflow:hidden;z-index:1}
.gm:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--drop)}
.gm .t1{display:flex;justify-content:space-between;gap:8px;font:500 11.5px/1 var(--mono);color:var(--muted)}
.gm .t2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gm b{font:700 15px/1.15 var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm .n{font:600 12.5px var(--mono);white-space:nowrap}
.gm.live{background:var(--acid);color:#12120f;box-shadow:0 3px 0 var(--acid-drop)}
.gm.live .t1{color:#3d4a06}
.gm.past{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);opacity:.6}
.gm.sel{background:var(--fg);color:var(--bg);box-shadow:0 4px 0 #000}
.gm.sel .t1{color:inherit;opacity:.7}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}

/* corpo: lista + mapa */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,42%);min-height:calc(100vh - 76px)}
.list{padding:30px max(28px,var(--gl)) 64px max(28px,var(--gl));min-width:0}
.lh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.lh h1{font-size:clamp(34px,3.4vw,52px)}
.lh p{margin:8px 0 0;color:var(--muted);font-size:15.5px}
.lh .acts{display:flex;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;align-items:center}
.chip{height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--sub);font:600 14px/1 var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .2s}
.chip:hover{background:var(--line2)}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.rad{position:relative;flex:none;background:var(--fg);color:var(--bg);padding:0 12px 0 13px;--spark:var(--acid)}
.chip.rad select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font:600 14px/1 var(--text);padding:0 18px 0 0;cursor:pointer;outline:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 7px) 55%,calc(100% - 2px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.chip.rad select option{color:#12120f}
.chip.rad:focus-within{outline:3px solid var(--acid);outline-offset:2px}
.radius{transition:width .45s var(--ease),height .45s var(--ease)}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;font:500 14px var(--text);color:var(--muted)}
.sort select{height:40px;border-radius:999px;border:0;background:var(--sub);padding:0 34px 0 14px;font:600 14px var(--text);color:var(--fg);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:26px}
.bc{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s var(--ease);animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bc:hover,.bc.hot{transform:translateY(-3px);box-shadow:0 5px 0 var(--drop),0 30px 50px -30px rgba(18,18,15,.5)}
.ph{position:relative;display:block;aspect-ratio:16/10;overflow:hidden;background:var(--sub)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.bc:hover .ph img{transform:scale(1.04)}
.ph .when{position:absolute;left:14px;top:14px;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:rgba(18,18,15,.82);color:#f1eee6;font:600 12.5px/1 var(--mono);backdrop-filter:blur(6px)}
.ph .when.lv{background:var(--live);color:#12120f}
.ph .elite{position:absolute;right:14px;top:14px;height:28px;padding:0 10px;border-radius:8px;background:#12120f;color:#c9f135;font:600 12px/28px var(--mono);letter-spacing:.06em}
.bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.r1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.r1 h3{margin:0;font:700 21px/1.2 var(--text)}
.r1 .meta{margin:5px 0 0;color:var(--muted);font-size:14.5px}
.fav{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--sub);display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.fav:hover{transform:scale(1.08)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--sub);font:600 13px/1 var(--text)}
.tags svg{opacity:.75}
.offer{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:14px;background:rgba(201,241,53,.22);font-size:14.5px;line-height:1.35}
.offer i{--spark:#e8320c;flex:none;width:32px;height:32px;border-radius:9px;background:var(--acid);color:#12120f;display:grid;place-items:center}
.ft{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.going{display:flex;align-items:center;gap:10px;font-size:14.5px}
.stack{display:flex}
.stack span{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2.5px var(--card)}
.stack span+span{margin-left:-9px}
.rate{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--muted)}
.rate b{font:400 22px/1 var(--display);color:var(--fg)}
.bc .go{margin-top:2px}
.empty{grid-column:1/-1;padding:48px 28px;text-align:center;border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--line2)}
.empty b{display:block;font:400 30px/1 var(--display);text-transform:uppercase}
.empty p{color:var(--muted);margin:10px 0 18px}

.mapcol{position:relative;border-left:1px solid var(--line)}
.map{position:sticky;top:76px;height:calc(100vh - 76px);overflow:hidden;background:var(--sub)}
.mapw{position:absolute}
.mapw img{width:100%;height:100%;display:block}
.m-l{display:block}.m-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m-l{display:none!important}:root:not([data-theme="light"]) .m-d{display:block!important}}
:root[data-theme="dark"] .m-l{display:none!important}:root[data-theme="dark"] .m-d{display:block!important}
.radius{position:absolute;border-radius:50%;border:2px dashed var(--fg);opacity:.35;transform:translate(-50%,-50%);pointer-events:none}
.me{position:absolute;width:20px;height:20px;border-radius:50%;background:#2f6bff;box-shadow:0 0 0 4px #fff,0 6px 14px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.me::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(47,107,255,.18);animation:ring 2.4s var(--ease) infinite}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;padding:0;background:none;cursor:pointer;transition:transform .25s var(--ease),opacity .25s;z-index:2}
.pin svg{display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.pin .nm{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);white-space:nowrap;background:#12120f;color:#f1eee6;font:700 13px/1 var(--text);padding:8px 11px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.pin.hot{transform:translate(-50%,-100%) scale(1.3);z-index:4}
.pin.hot .nm{opacity:1}
.pin.dim{opacity:.35}
.mapbar{position:absolute;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;gap:10px;z-index:5}
.mapbar .chip{background:var(--card);box-shadow:0 3px 0 var(--drop)}
.legend{position:absolute;left:18px;bottom:18px;display:flex;gap:14px;background:var(--card);padding:10px 14px;border-radius:14px;box-shadow:0 3px 0 var(--drop);font:500 12.5px var(--mono);color:var(--muted);z-index:5}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}

/* página do bar */
.barpage{padding-bottom:80px}
.hero{position:relative;height:min(52vh,520px);overflow:hidden;background:#12120f}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.88}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,15,.15) 0%,rgba(18,18,15,0) 35%,rgba(18,18,15,.85) 100%)}
.hero-in{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#f1eee6;padding:0 max(28px,var(--gl)) 34px max(28px,var(--gr));max-width:1320px;margin:0 auto}
.hero h1{font-size:clamp(52px,6vw,88px)}
.hero .meta{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:16px;color:#e7e3db}
.hero .open{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:rgba(201,241,53,.18);color:#c9f135;font:600 13px var(--mono)}
.back{position:absolute;left:max(28px,var(--gl));top:22px;z-index:3;background:rgba(241,238,230,.92);color:#12120f}
.hero .hacts{position:absolute;right:max(28px,var(--gr));top:22px;z-index:3;display:flex;gap:8px}
.hero .hacts .btn{background:rgba(241,238,230,.92);color:#12120f}
.bwrap{max-width:1320px;margin:0 auto;padding:0 max(28px,var(--gl)) 0 max(28px,var(--gr));display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:48px;margin-top:36px}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gal img{aspect-ratio:4/3;object-fit:cover;border-radius:16px;width:100%}
.sec{margin-top:44px}
.sec h2{font:400 30px/1 var(--display);text-transform:uppercase;margin:0 0 18px}
.today{--spark:#c9f135;background:var(--fg);color:var(--bg);border-radius:28px;padding:28px;box-shadow:0 5px 0 #000}
.today .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.today .tt p{margin:0;font:500 13.5px var(--mono);opacity:.7}
.today h3{font:400 clamp(36px,3.6vw,52px)/.95 var(--display);text-transform:uppercase;margin:10px 0 0}
.today .tags li{background:rgba(127,127,110,.22)}
.today .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:22px}
.today .offer{background:rgba(201,241,53,.16);margin-top:18px}
.nextl{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--fg)}
.nextl li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.nextl .h{font:400 26px/1 var(--display)}
.nextl .h small{display:block;font:500 12px var(--mono);color:var(--muted);margin-top:5px}
.nextl b{font-size:17px}
.nextl .tagx{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--sub);font:600 13px/1 var(--text);white-space:nowrap}
.nextl p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
.amen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.amen h4{margin:0 0 10px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.amen ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:15.5px}
.amen li{display:flex;gap:10px;align-items:center}
.score{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.score .big{font:400 96px/.8 var(--display)}
.score p{margin:0;color:var(--muted)}
.score p b{display:block;color:var(--fg);font-size:17px}
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.quotes blockquote{margin:0;background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.5}
.quotes footer{margin-top:12px;font-size:13px;color:var(--muted)}
.aside{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:16px}
.box{background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.minimap{position:relative;height:200px;border-radius:16px;overflow:hidden;margin:-6px -6px 16px}
.minimap img{position:absolute;width:300%;max-width:none;left:-110%;top:-35%}
.hrs{list-style:none;margin:14px 0 0;padding:0;font:500 14px var(--mono)}
.hrs li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line2)}
.hrs li.td{font-weight:700}

/* folha de entrar */
.scrim{position:fixed;inset:0;background:rgba(18,18,15,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:90;background:var(--bg);box-shadow:-30px 0 60px -20px rgba(0,0,0,.4);transform:translateX(104%);transition:transform .45s var(--ease);display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top,0px)) max(28px,var(--gr)) calc(28px + env(safe-area-inset-bottom,0px)) 28px;overflow-y:auto}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sheet .x{align-self:flex-end}
.sheet h2{font:400 40px/.95 var(--display);text-transform:uppercase;margin:8px 0 0}
.ctx{display:flex;gap:14px;align-items:center;margin-top:22px;padding:12px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.ctx img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.ctx b{display:block;font-size:16px}
.ctx span{font-size:14px;color:var(--muted)}
.why{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
.why li{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.why i{--spark:#e8320c;width:40px;height:40px;border-radius:12px;background:var(--acid);display:grid;place-items:center;color:#12120f}
.why b{display:block;font-size:16px}
.why span{color:var(--muted);font-size:14.5px}
.form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form input{height:52px;border-radius:16px;border:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--line2);padding:0 16px;font:500 16px var(--text);color:var(--fg);outline:none}
.form input:focus{box-shadow:inset 0 0 0 2px var(--fg)}
.form .btn{height:54px;margin-top:6px}
.sheet .alt{margin-top:16px;text-align:center;font-size:14.5px;color:var(--muted)}
.sheet .alt a{color:var(--fg);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:95;background:#12120f;color:#f1eee6;border-radius:16px;padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 #000,0 20px 40px -10px rgba(0,0,0,.5);transition:transform .45s var(--ease);font-size:15px}
.toast.on{transform:translate(-50%,0)}
.toast i{width:28px;height:28px;border-radius:50%;background:#c9f135;display:grid;place-items:center;color:#12120f}

.mapbtn{display:none}
@media (max-width:1100px){
  .main{grid-template-columns:1fr}
  .mapcol{display:none}
  .main.showmap .mapcol{display:block;position:fixed;inset:76px 0 0;z-index:30}
  .mapbtn{display:inline-flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:35}
  .bwrap{grid-template-columns:1fr}
  .aside{position:static}
}
@media (max-width:760px){
  .top-in{gap:10px;height:66px;padding-left:var(--gl);padding-right:var(--gr)}
  .logo b{display:none}
  .where,.top nav .lnk,.top .sp{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:0 var(--gr) 4px var(--gl);scrollbar-width:none}
  .chips .chip{flex:none}
  .chips::-webkit-scrollbar{display:none}
  .sort{flex:none}
  .lh .acts{width:100%}.lh .acts .btn{flex:1}
  .night{padding-left:var(--gl);padding-right:var(--gr)}
  .list{padding-left:var(--gl);padding-right:var(--gr)}
  .cards{grid-template-columns:1fr;gap:18px}
  .sort{margin-left:0}
  .gal{grid-template-columns:1fr 1fr}
  .amen,.quotes{grid-template-columns:1fr}
  .bwrap{padding-left:var(--gl);padding-right:var(--gr)}
  .hero-in{padding-left:var(--gl);padding-right:var(--gr)}
  .back{left:var(--gl)}.hero .hacts{right:var(--gr)}
  .nextl li{grid-template-columns:80px minmax(0,1fr)}
  .nextl li .tagx{display:none}
  .main.showmap .mapcol{top:66px}
}
/* ---------- celular: mapa + folha ---------- */
.mx{position:relative;height:calc(100dvh - 66px - env(safe-area-inset-top,0px));overflow:hidden;background:var(--sub)}
.mx .map{position:absolute;inset:0;height:auto;top:0}
.mtop{position:absolute;left:0;right:0;top:0;z-index:6;padding:12px 0 22px;background:linear-gradient(180deg,var(--bg) 62%,transparent)}
.mtop .days{margin:0 var(--gr) 0 var(--gl);width:max-content}
.mtop .days button{height:34px;padding:0 14px;font-size:13.5px}
.gcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px var(--gr) 6px var(--gl);scrollbar-width:none}
.gcar::-webkit-scrollbar{display:none}
.gcar .gm{position:relative;flex:0 0 auto;width:238px;height:74px;scroll-snap-align:start;left:auto!important;top:auto!important}
.gcar .gm b{font-size:15px}
.mpick{position:absolute;left:12px;right:12px;z-index:7;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:22px;background:var(--card);box-shadow:0 4px 0 var(--drop),0 24px 40px -18px rgba(0,0,0,.45);animation:in .35s var(--ease) both;text-decoration:none}
.mpick img{width:72px;height:72px;border-radius:14px;object-fit:cover}
.mpick b{display:block;font-size:16.5px;line-height:1.2}
.mpick span{font-size:13.5px;color:var(--muted)}
.mpick .x{width:36px;height:36px}
.msheet{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px -10px rgba(18,18,15,.35);display:flex;flex-direction:column;transition:transform .45s var(--ease);will-change:transform;touch-action:pan-x}
.msheet.drag{transition:none}
.grab{flex:none;height:26px;display:grid;place-items:center;cursor:grab}
.grab span{width:44px;height:5px;border-radius:5px;background:var(--line2)}
.mhd{flex:none;padding:0 var(--gr) 0 var(--gl);cursor:grab}
.mhd h1{font-size:32px}
.mhd p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.msheet .chips{flex:none;margin-top:14px}
.msc{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px var(--gr) calc(28px + env(safe-area-inset-bottom,0px)) var(--gl);touch-action:pan-y}
.mcards{display:flex;flex-direction:column;gap:16px}
.mcards .bc{border-radius:22px}
.mcards .ph{aspect-ratio:16/9}
.mcards .bd{padding:16px 18px 18px;gap:12px}
.mcards .r1 h3{font-size:19px}
.mcards .go{width:100%}
.mlist-btn{position:absolute;left:50%;transform:translateX(-50%);z-index:7}
/* bar no celular */
.mbar{display:none}
@media (max-width:760px){
  .hero{height:62vh;min-height:420px}
  .hero h1{font-size:56px}
  .hero .meta{font-size:14.5px}
  .back{top:14px}.hero .hacts{top:14px}
  .back span.lbl{display:none}
  .bwrap{margin-top:20px;gap:0}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:0 var(--gr) 0 var(--gl);scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal img{flex:0 0 74%;scroll-snap-align:start}
  .today{padding:22px;border-radius:24px}
  .today .row .btn{display:none}
  .today .row{margin-top:14px}
  .sec{margin-top:36px}
  .sec h2{font-size:26px}
  .score .big{font-size:76px}
  .quotes{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:0 var(--gr) 6px var(--gl);scrollbar-width:none}
  .quotes blockquote{flex:0 0 80%;scroll-snap-align:start}
  .aside{margin-top:36px}
  .barpage{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;gap:12px;align-items:center;padding:12px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gl);background:var(--bg);box-shadow:0 -1px 0 var(--line),0 -16px 30px -18px rgba(18,18,15,.4)}
  .mbar .info{flex:1;min-width:0;line-height:1.3}
  .mbar .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar .info span{font-size:13px;color:var(--muted)}
  .mbar .btn{height:52px}
  .sheet{top:auto;left:0;width:100%;max-height:94dvh;border-radius:28px 28px 0 0;transform:translateY(104%);padding:14px var(--gr) calc(22px + env(safe-area-inset-bottom,0px)) var(--gl);box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
  .sheet::before{content:"";align-self:center;width:44px;height:5px;border-radius:5px;background:var(--line2);margin-bottom:4px}
  .sheet .x{position:absolute;right:var(--gr);top:16px}
  .sheet h2{font-size:32px;margin-top:14px;padding-right:48px}
  .why{gap:12px;margin-top:18px}
  .form{margin-top:20px}
  .mapbtn{display:none!important}
}

/* ---------- torcedor logado ---------- */
.acct{display:none;align-items:center;gap:6px}
.logged .acct{display:flex}
.logged [data-login="entrar"]{display:none}
.acct a{font:600 15px var(--text);text-decoration:none;padding:10px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:8px}
.acct a:hover,.acct a.cur{background:var(--sub)}
.acct a .n{font:600 12px var(--mono);background:var(--acid);color:#12120f;border-radius:999px;padding:2px 7px}
.ava{width:40px;height:40px;border-radius:50%;background:#e8320c;color:#fff;display:grid;place-items:center;font:700 14px var(--text);border:0;cursor:pointer;flex:none}
.page{max-width:1120px;margin:0 auto;padding:36px max(28px,var(--gr)) 96px max(28px,var(--gl))}
.page .k{font:500 14px var(--mono);color:var(--muted)}
.page h1{font-size:clamp(40px,4.4vw,60px);margin-top:6px}
.page .sub{margin:10px 0 0;color:var(--body);font-size:16.5px;max-width:60ch}
.tabsx{display:flex;gap:4px;background:var(--sub);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;margin-top:24px}
.tabsx button{border:0;background:transparent;height:40px;padding:0 16px;border-radius:999px;font:600 14.5px var(--text);cursor:pointer;white-space:nowrap}
.tabsx button.on{background:var(--fg);color:var(--bg)}
.tabsx .n{font:600 12px var(--mono);opacity:.6;margin-left:6px}
.tk{display:grid;grid-template-columns:200px minmax(0,1fr) 230px;margin-top:18px;border-radius:26px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.tk .ph{aspect-ratio:auto;height:100%;min-height:180px}
.tk .ph img{height:100%}
.tk .bd{padding:22px 24px;gap:10px}
.tk .when2{font:600 13px var(--mono);color:var(--muted)}
.tk h3{margin:0;font:400 34px/.95 var(--display);text-transform:uppercase}
.tk .at{font-size:15px;color:var(--body)}
.tk .side{position:relative;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;border-left:2px dashed var(--line2)}
.tk .side::before,.tk .side::after{content:"";position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.tk .side::before{top:-11px}.tk .side::after{bottom:-11px}
.tk .code{font:600 30px/1 var(--mono);letter-spacing:.08em}
.tk .code small{display:block;font:600 11px var(--mono);letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.tk.dim{opacity:.9}
.cta-row{display:flex;gap:8px;flex-wrap:wrap}
.notice{display:flex;gap:14px;align-items:center;margin-top:18px;padding:16px 18px;border-radius:20px;background:var(--inkc,#12120f);color:#f1eee6;--spark:var(--acid)}
.notice b{display:block;font-size:16px}
.notice span{font-size:14px;opacity:.75}
.notice .btn{margin-left:auto}
.past{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.past .h{font:400 26px/1 var(--display)}
.past .h small{display:block;font:500 12px var(--mono);color:var(--muted);margin-top:5px}
.past b{font-size:17px}
.past p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
.vchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font:600 12.5px var(--text);background:var(--acid);color:#12120f;--spark:#e8320c}
.vchip.n{background:var(--sub);color:var(--fg)}
/* código */
.codepage{min-height:calc(100vh - 76px);background:#0b0b09;color:#f1eee6;display:grid;place-items:center;padding:30px var(--gr) 60px var(--gl);--spark:#c9f135}
.ticket{width:min(440px,100%);background:#f1eee6;color:#12120f;border-radius:30px;overflow:hidden;box-shadow:0 6px 0 #000,0 50px 90px -30px rgba(0,0,0,.8);--spark:#e8320c}
.ticket .top{padding:24px 26px 20px;display:flex;justify-content:space-between;gap:12px}
.ticket .top b{display:block;font-size:17px}
.ticket .top span{font-size:14px;color:#55554f}
.ticket .lv{font:600 11.5px var(--mono);background:#12120f;color:#c9f135;padding:6px 8px;border-radius:7px;align-self:flex-start;letter-spacing:.06em;white-space:nowrap}
.qrw{display:grid;place-items:center;padding:6px 26px 0}
.qrw .q2{width:220px;height:220px;background:#fff;border-radius:18px;padding:14px;display:grid;place-items:center}
.qrw .q2 img,.qrw .q2 canvas{width:192px!important;height:192px!important}
.ticket .big{font:600 46px/1 var(--mono);letter-spacing:.1em;text-align:center;margin:20px 0 4px}
.ticket .hint{text-align:center;font-size:14px;color:#55554f;margin:0 26px}
.ticket .cut{margin:22px -1px 0;border-top:2px dashed #cfcabf;position:relative}
.ticket .cut::before,.ticket .cut::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:#0b0b09}
.ticket .cut::before{left:-12px}.ticket .cut::after{right:-12px}
.ticket .of{display:flex;gap:14px;align-items:center;padding:20px 26px 26px}
.ticket .of .ib{width:44px;height:44px;border-radius:12px;background:#c9f135;display:grid;place-items:center;flex:none}
.ticket .of b{display:block;font-size:16px}
.ticket .of span{font-size:14px;color:#55554f}
.codeacts{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.codeacts .btn{color:#f1eee6;box-shadow:inset 0 0 0 1.5px rgba(241,238,230,.3)}
.codepage .note{margin:18px auto 0;text-align:center;color:#aaa9a4;font-size:14px;max-width:44ch}
/* seus bares */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:18px}
.wk .d{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;min-height:150px}
.wk .d.hj{box-shadow:inset 0 0 0 2px var(--fg),var(--shadow)}
.wk h4{margin:0;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk h4 b{display:block;font:400 24px/1 var(--display);color:var(--fg);letter-spacing:0;margin-top:3px}
.wk a{display:block;margin-top:8px;padding:9px;border-radius:12px;background:var(--sub);text-decoration:none;font-size:12.5px;line-height:1.3}
.wk a b{display:block;font:400 17px/1 var(--display)}
.saved{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.sv{border-radius:22px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);text-decoration:none;display:block}
.sv img{aspect-ratio:16/10;object-fit:cover;width:100%}
.sv .in{padding:14px 16px 16px}
.sv b{display:block;font-size:17px}
.sv span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.sv .nx{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font:600 13px var(--text);background:var(--sub);padding:6px 10px;border-radius:999px}
.vis{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:16px}
.vis div{text-align:center;font:500 11.5px var(--mono);color:var(--muted)}
.vis i{display:block;height:80px;border-radius:10px;background:var(--sub);margin-bottom:6px;position:relative;overflow:hidden}
.vis i span{position:absolute;left:0;right:0;bottom:0;background:var(--acid);box-shadow:inset 0 0 0 1.5px #12120f;border-radius:10px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.stats3 b{display:block;font:400 44px/.9 var(--display)}
.stats3 span{font-size:14px;color:var(--muted)}
/* avaliar */
.rvw{max-width:620px;margin:0 auto}
.rvw .head{display:flex;gap:14px;align-items:center;margin-top:20px;padding:14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.rvw .head img{width:72px;height:72px;border-radius:14px;object-fit:cover}
.rvw .head b{display:block;font-size:17px}
.rvw .head span{font-size:14px;color:var(--muted)}
.q3{margin-top:30px}
.q3 h2{font:400 30px/1 var(--display);text-transform:uppercase;margin:0}
.q3 p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.yn button{height:62px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font:700 17px var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s var(--ease)}
.yn button:active{transform:translateY(2px)}
.yn button[aria-pressed="true"]{background:var(--fg);color:var(--bg);--spark:var(--acid)}
.stars{display:flex;gap:8px;margin-top:14px}
.stars button{width:56px;height:56px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;color:var(--line2);transition:transform .15s var(--ease)}
.stars button.on{color:#12120f;background:var(--acid);--spark:#12120f}
.stars button:hover{transform:translateY(-2px)}
.why2{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.why2 button{height:42px;padding:0 16px;border:0;border-radius:999px;background:var(--sub);font:600 14.5px var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.why2 button[aria-pressed="true"]{background:var(--fg);color:var(--bg);--spark:var(--acid)}
.rvw textarea{width:100%;margin-top:14px;min-height:96px;border:0;border-radius:18px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line2);padding:14px 16px;font:500 16px/1.45 var(--text);color:var(--fg);resize:vertical;outline:none}
.rvw textarea:focus{box-shadow:inset 0 0 0 2px var(--fg)}
.togrow{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:15px}
.tg{margin-left:auto;position:relative;width:52px;height:30px;border-radius:999px;border:0;background:var(--line2);cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#f1eee6;transition:transform .25s var(--ease)}
.tg[aria-checked="true"]{background:#c9f135}
.tg[aria-checked="true"]::after{transform:translateX(22px);background:#12120f}
.verif{display:flex;gap:12px;align-items:center;margin-top:24px;padding:14px 16px;border-radius:18px;background:var(--acid);color:#12120f;font-size:14.5px;--spark:#e8320c}
.sendrow{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}
.done2{text-align:center;padding:60px 0}
.done2 .big{width:96px;height:96px;border-radius:28px;background:var(--acid);display:grid;place-items:center;margin:0 auto;color:#12120f;--spark:#e8320c;box-shadow:0 5px 0 var(--acid-drop)}
@media (max-width:900px){
  .tk{grid-template-columns:1fr}
  .tk .ph{min-height:0;aspect-ratio:16/8}
  .tk .side{border-left:0;border-top:2px dashed var(--line2);flex-direction:row;align-items:center}
  .tk .side::before{left:-11px;top:-12px}.tk .side::after{left:auto;right:-11px;top:-12px;bottom:auto}
  .saved{grid-template-columns:1fr 1fr}
  .wk{grid-template-columns:repeat(7,minmax(130px,1fr));overflow-x:auto}
}
@media (max-width:760px){
  .acct a{display:none}
  .page{padding:22px var(--gr) calc(110px + env(safe-area-inset-bottom,0px)) var(--gl)}
  .saved{grid-template-columns:1fr}
  .past{grid-template-columns:72px minmax(0,1fr)}
  .past .vchip,.past .btn{grid-column:2;justify-self:start}
  .stats3 b{font-size:34px}
  .stars button{width:52px;height:52px}
  .notice{flex-wrap:wrap}.notice .btn{margin-left:0}

function wireSheet(){
  var s=document.getElementById('msheet');if(!s)return;applySnap(false);
  var y0=0,t0=0,dragging=false,moved=0;
  function down(e){if(e.target.closest('button'))return;dragging=true;moved=0;y0=e.clientY;var m=/translateY\((-?[\d.]+)px\)/.exec(s.style.transform);t0=m?+m[1]:0;s.classList.add('drag');try{e.target.setPointerCapture(e.pointerId)}catch(_){} }
  function move(e){if(!dragging)return;var d=e.clientY-y0;moved=Math.max(moved,Math.abs(d));var sn=snaps();placeSheet(Math.min(sn.peek+20,Math.max(sn.full-10,t0+d)),false)}
  function up(e){if(!dragging)return;dragging=false;var sn=snaps(),m=/translateY\((-?[\d.]+)px\)/.exec(s.style.transform),y=m?+m[1]:sn.half;
    if(moved<6){S.snap=S.snap==='peek'?'half':S.snap==='half'?'full':'peek'}
    else{var best='half',bd=1e9;['full','half','peek'].forEach(function(k){var d=Math.abs(sn[k]-y);if(d<bd){bd=d;best=k}});S.snap=best}

  ['grab','mhd'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('pointerdown',down);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});

/* ---------- render ---------- */
var view=document.getElementById('view');
function render(){
  var r=location.hash.slice(1);
  var isBar=r.indexOf('bar-')===0,acc=/^(meus-jogos|seus-bares|codigo-|avaliar-|perfil|pra-voce|preferencias|bem-vindo)/.test(r);
  [].forEach.call(document.querySelectorAll('[data-ic2]'),function(e){e.outerHTML=ic(e.dataset.ic2,19)});
  if(acc&&!S.logged){setLogged(true)}
  [].forEach.call(document.querySelectorAll('[data-nav]'),function(a){a.classList.toggle('cur',r.indexOf(a.dataset.nav)===0)});
  if(acc){var V2={'meus-jogos':meusjogos,'seus-bares':seusbares,perfil:perfil,'pra-voce':pravoce,preferencias:preferencias,'bem-vindo':onboarding};view.innerHTML=(V2[r]?V2[r]():r.indexOf('codigo-')===0?codigo(r.slice(7)):avaliar(r.slice(8)))+(r==='bem-vindo'?'':fanTabs(r.indexOf('seus')===0||r==='perfil'||r==='preferencias'?'perfil':r==='pra-voce'?'pra-voce':'meus-jogos'));scrollTo(0,0);return}
  view.innerHTML=isBar?barpage(r.slice(4))+mbarHtml(r.slice(4)):(MQ.matches?explorarMobile():explorar());
  if(isBar)scrollTo(0,0);
  fitMap();
  if(!isBar&&MQ.matches)wireSheet();
  var rw=view.querySelector('.rule-wrap'),sg=view.querySelector('.gm.sel');
  if(rw&&sg){rw.style.scrollBehavior='auto';rw.scrollLeft=sg.offsetLeft+sg.offsetWidth/2-rw.clientWidth/2;rw.style.scrollBehavior=''}
}
function fitMap(){
  var m=document.getElementById('map'),w=document.getElementById('mapw');if(!m||!w)return;
  var W=m.clientWidth,H=m.clientHeight,s=Math.max(W/1400,H/1100);
  w.style.width=1400*s+'px';w.style.height=1100*s+'px';w.style.left=(W-1400*s)/2+'px';w.style.top=(H-1100*s)/2+'px';
}
addEventListener('resize',function(){fitMap();applySnap(false)});
MQ.addEventListener('change',render);
addEventListener('hashchange',render);

  var rr=e.target.closest&&e.target.closest('[data-rdrow],[data-rdpin]');if(rr){var rid=rr.dataset.rdrow||rr.dataset.rdpin;if(S.rdHot!==rid)rdHot(rid)}
  var c=e.target.closest('[data-bar].bc,[data-pin]');var id=c?(c.dataset.pin||c.dataset.bar):null;
  if(id===S.hot)return;S.hot=id;

  [].forEach.call(view.querySelectorAll('.bc'),function(p){p.classList.toggle('hot',p.dataset.bar===id)});
});

  var t;

  if(t=e.target.closest('#mapbtn')){var m=document.getElementById('main');m.classList.toggle('showmap');t.textContent=m.classList.contains('showmap')?'Ver lista':'Ver mapa';fitMap();return}
});

var app=document.documentElement,sheet=document.getElementById('sheet'),last=null,pend=null;
var WHY={
  vou:[['Código do balcão','Nos bares Elite, libera a oferta da casa.'],['Seus amigos veem que você vai','Só quem é seu amigo, e só se você deixar.'],['Sua avaliação vale','Depois do jogo, você diz se voltaria.']],
  fav:[['Seus bares num lugar só','Veja a semana de jogos dos bares salvos.'],['Aviso quando passar seu time','Num bar que você salvou, perto de você.'],['Funciona no web e no app','A mesma conta nos dois.']],
  lembrar:[['Aviso 3 h antes','Com os bares que vão passar o jogo.'],['Sem perder o horário','Você escolhe o bar na hora.'],['Funciona no web e no app','A mesma conta nos dois.']],
  entrar:[['Vou assistir aqui','Marque presença e pegue o código do balcão.'],['Bares salvos','A semana de jogos dos seus bares.'],['Meus jogos','Os próximos e os que você já viu.']]
};
var TITLE={vou:'Entre para marcar presença',fav:'Entre para salvar este bar',lembrar:'Entre para receber o lembrete',entrar:'Entre na Onside'};
var GO={vou:'Entrar e marcar presença',fav:'Entrar e salvar',lembrar:'Entrar e me lembrar',entrar:'Entrar'};
var WI=[ic('ticket',20),ic('people',20),ic('star',20)];
function openSheet(kind,barId){
  var b=BARS.filter(function(x){return x.id===barId})[0],g=game();pend={kind:kind,b:b,g:g};
  document.getElementById('sh-t').textContent=TITLE[kind];
  document.getElementById('sh-go').textContent=GO[kind];
  var ctx=document.getElementById('sh-ctx');
  if(b){ctx.hidden=false;ctx.innerHTML='<img src="a/bar-'+b.id+'.webp" alt=""><span><b>'+esc(b.n)+'</b><span>'+(kind==='fav'?b.h+' · '+b.km:esc(g.g)+' · '+(g.st==='live'?'ao vivo':'hoje '+g.h))+'</span></span>'}
  else if(kind==='lembrar'){ctx.hidden=false;ctx.innerHTML='<span style="width:64px;height:64px;border-radius:12px;background:#12120f;color:#c9f135;display:grid;place-items:center;font:400 22px Anton">'+g.h+'</span><span><b>'+esc(g.g)+'</b><span>'+g.c+' · hoje</span></span>'}
  else ctx.hidden=true;
  document.getElementById('sh-why').innerHTML=WHY[kind].map(function(w,i){return '<li><i>'+WI[i]+'</i><span><b>'+w[0]+'</b><span>'+w[1]+'</span></span></li>'}).join('');
  last=document.activeElement;app.classList.add('open');sheet.setAttribute('aria-hidden','false');
  setTimeout(function(){document.getElementById('sh-e').focus()},reduce?0:300);
}
function closeSheet(){app.classList.remove('open');sheet.setAttribute('aria-hidden','true');if(last)last.focus()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-login]');if(t){e.preventDefault();if(S.logged&&t.dataset.login!=='entrar'){pend={kind:t.dataset.login,b:BARS.filter(function(x){return x.id===t.dataset.bar})[0],g:game()};document.getElementById('sh-form').dispatchEvent(new Event('submit',{cancelable:true}));return}openSheet(t.dataset.login,t.dataset.bar)}});
document.getElementById('sh-x').addEventListener('click',closeSheet);
document.getElementById('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&app.classList.contains('open'))closeSheet()});
document.getElementById('sh-demo').addEventListener('click',function(){document.getElementById('sh-e').value='lucas@exemplo.com';document.getElementById('sh-p').value='exemplo';document.getElementById('sh-form').requestSubmit()});
document.getElementById('sh-new').addEventListener('click',function(e){e.preventDefault();S.newAcct=true;document.getElementById('sh-go').textContent='Criar conta e continuar';document.getElementById('sh-p').setAttribute('autocomplete','new-password');document.getElementById('sh-t').textContent='Crie sua conta grátis';});
document.getElementById('sh-form').addEventListener('submit',function(e){
  e.preventDefault();var p=pend;closeSheet();setLogged(true);
  if(S.newAcct){S.newAcct=false;S.ob=0;location.hash='bem-vindo';return}
  if(p.kind==='vou'&&p.b){var gi=p.g.id;S.going=S.going.filter(function(x){return !(x.bar===p.b.id&&x.game===gi)});S.going.unshift({bar:p.b.id,game:gi,code:'GRTGVX'});location.hash=p.b.elite?'codigo-0':'meus-jogos';toast(p.b.elite?'Pronto: você vai assistir aqui. Este é o seu código.':'Pronto: você vai assistir aqui. Faça check-in quando chegar.');return}
  if(p.kind==='fav'&&p.b){if(S.saved.indexOf(p.b.id)<0)S.saved.unshift(p.b.id);toast(p.b.n+' salvo em Seus bares.');render();return}
  if(p.kind==='entrar'){location.hash='meus-jogos';return}
  var msg={vou:p.b?'Você vai assistir '+p.g.g+' no '+p.b.n+'. Código pronto em Meus jogos.':'',fav:p.b?p.b.n+' salvo nos seus bares.':'',lembrar:'Lembrete de '+p.g.g+' às '+(p.g.h)+', 3 h antes.',entrar:'Você entrou.'}[p.kind];
  toast(msg+' (exemplo, nada foi gravado)');
});
var tt;function toast(s){var t=document.getElementById('toast');document.getElementById('toast-t').textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},3600)}

render();
})();
